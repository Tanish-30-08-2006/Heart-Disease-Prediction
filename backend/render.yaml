# backend/render.yaml
# Render Infrastructure-as-Code.
# Commit this file to your repo — Render reads it automatically.

services:
  - type: web
    name: cardiorisk-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: FRONTEND_URL
        value: https://your-app.vercel.app   # ← replace after Vercel deploy
      - key: PYTHON_VERSION
        value: "3.11.0"